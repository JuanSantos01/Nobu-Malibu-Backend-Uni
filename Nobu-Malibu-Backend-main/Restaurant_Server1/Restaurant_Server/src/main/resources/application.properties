# ===================================================================
# DATABASE CONFIGURATION (AIVEN CLOUD)
# ===================================================================
spring.datasource.url=jdbc:mysql://mysql-37d9fdde-juanpabloalvissantos27-0e93.f.aivencloud.com:22573/defaultdb?useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE PROPERTIES
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# GROQ API CONFIGURATION
# ===================================================================
groq.api.key=${GROQ_API_KEY}

# ===================================================================
# MULTIPART FILE UPLOAD PROPERTIES
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# GOOGLE SIGN-IN (ID de cliente "Web" de Google Cloud; varios separados por coma)
# En Render: variable de entorno GOOGLE_CLIENT_IDS
# ===================================================================
google.client-ids=${GOOGLE_CLIENT_IDS:}

# ===================================================================
# PAGOS: garantía de reserva por persona, en centavos (500 = $5.00). Env: DEPOSIT_PER_GUEST_CENTS
# ===================================================================
nobu.payments.deposit-per-guest-cents=${DEPOSIT_PER_GUEST_CENTS:500}
restaurant.timezone=${RESTAURANT_TIMEZONE:America/Bogota}
